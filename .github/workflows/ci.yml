name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tickbron_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tickbron
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tickbron_user" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: tickbron
      DB_USER: tickbron_user
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: '5432'
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest --create-db -q
      - name: Dependency advisories (runtime requirements)
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency advisories (production dependencies)
        run: npm audit --omit=dev

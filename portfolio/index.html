<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Sardor Rahimov: tadbirkor va investor. Xalqaro sertifikatlar, shaxsiy veb-sayt va aloqa ma'lumotlari." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#04060a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sardor Rahimov" />
    <meta property="og:description" content="Tadbirkor va investor. Sertifikatlar, shaxsiy sayt va aloqa." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sardor Rahimov</title>
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
